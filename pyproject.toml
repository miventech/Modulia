[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "modulai"
version = "0.1.0"
description = "Asistente personal privado y modular"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "ModulAI" }]
dependencies = [
    "fastapi>=0.115,<1",
    "truststore>=0.10,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]
media = [
    "yt-dlp>=2025.01",
]
transcription = [
    "faster-whisper>=1.1,<2",
]
telegram = [
    "python-telegram-bot>=22,<23",
]

[project.scripts]
modulai = "modulai.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["modulai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
